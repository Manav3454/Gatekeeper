spring.application.name=Api-Management-Service
server.port=8081

info.service.name=Api-Management-Service
info.service.description=Custom api gateway for routing, security and traffic management

spring.datasource.url=jdbc:mysql://localhost:3307/gatekeeper_management?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

security.jwt.expiration-seconds=3600
security.jwt.secret=${JWT_SECRET}
